apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: temporal
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: temporal, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: temporal, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.temporal | quote }}
      automountServiceAccountToken: false
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: temporal
          image: {{ .Values.images.temporal | quote }}
          imagePullPolicy: IfNotPresent
          args: [start]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecretName | quote }} }
          ports:
            - { name: grpc, containerPort: 7233 }
          livenessProbe:
            tcpSocket: { port: 7233 }
          readinessProbe:
            exec: { command: [temporal, operator, cluster, health] }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            {{- include "ui4a.containerSecurityContext" . | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: temporal-ui
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
