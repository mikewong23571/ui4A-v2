apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: runner
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: runner, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: runner, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.runner | quote }}
      automountServiceAccountToken: false
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: runner
          image: {{ .Values.images.runner | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, dist/main.js, daemon]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecretName | quote }} }
          ports:
            - { name: http, containerPort: 3102 }
          volumeMounts:
            - { name: runtime-data, mountPath: /workspaces }
          livenessProbe:
            httpGet: { path: /live, port: 3102 }
          readinessProbe:
            httpGet: { path: /ready, port: 3102 }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            {{- include "ui4a.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: runtime-data
          persistentVolumeClaim: { claimName: runtime-data }
