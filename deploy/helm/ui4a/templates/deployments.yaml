  template:
    metadata:
      labels: { app.kubernetes.io/name: temporal-ui, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.temporal | quote }}
      automountServiceAccountToken: false
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: temporal-ui
          image: {{ .Values.images.temporalUi | quote }}
          imagePullPolicy: IfNotPresent
