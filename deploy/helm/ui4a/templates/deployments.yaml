apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: runner
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: runner, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: runner, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.runner | quote }}
      automountServiceAccountToken: true
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      initContainers:
        {{- include "ui4a.trustInit" . | nindent 8 }}
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "pki-init") | nindent 8 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: runner
          image: {{ .Values.images.runner | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, dist/main.js, daemon]
          env:
            {{- include "ui4a.productionEnv" . | nindent 12 }}
