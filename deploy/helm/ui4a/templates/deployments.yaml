      automountServiceAccountToken: false
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak | quote }}
          imagePullPolicy: IfNotPresent
          args: [start]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecretName | quote }} }
          ports:
