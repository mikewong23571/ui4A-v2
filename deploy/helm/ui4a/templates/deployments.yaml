apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: temporal
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: temporal, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: temporal, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.temporal | quote }}
      automountServiceAccountToken: false
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      initContainers:
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "temporal-schema" "apiToken" true) | nindent 8 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: temporal
          image: {{ .Values.images.temporal | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              exec temporal-server --root /etc/temporal --config config --env docker start
          ports:
            - { name: grpc, containerPort: 7233 }
          livenessProbe:
            grpc: { port: 7233 }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            grpc: { port: 7233 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: temporal-static-config, mountPath: /etc/temporal/config/docker.yaml, subPath: docker.yaml, readOnly: true }
            - { name: temporal-dynamic-config, mountPath: /etc/temporal/dynamicconfig/docker.yaml, subPath: docker.yaml, readOnly: true }
            - { name: temporal-runtime-password, mountPath: /run/secrets/temporal-runtime-password, subPath: temporal-runtime-password, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            {{- include "ui4a.temporalContainerSecurityContext" . | nindent 12 }}
      volumes:
        {{- include "ui4a.dependencyApiTokenVolume" . | nindent 8 }}
        - name: temporal-static-config
          configMap: { name: ui4a-temporal-static }
        - name: temporal-dynamic-config
          configMap: { name: ui4a-temporal-dynamic }
        - name: temporal-runtime-password
          secret:
            secretName: {{ .Values.secrets.existingSecretName | quote }}
            items:
              - { key: temporal-runtime-password, path: temporal-runtime-password }
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: temporal-ui
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: temporal-ui, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: temporal-ui, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.temporal | quote }}
      automountServiceAccountToken: false
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      initContainers:
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "temporal") | nindent 8 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: temporal-ui
          image: {{ .Values.images.temporalUi | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: TEMPORAL_ADDRESS, value: 'temporal:7233' }
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
          readinessProbe:
            tcpSocket: { port: 8080 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            {{- include "ui4a.nodeContainerSecurityContext" . | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: keycloak
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.keycloak | quote }}
      automountServiceAccountToken: true
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      initContainers:
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "postgres-bootstrap") | nindent 8 }}
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "pki-init") | nindent 8 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak | quote }}
          imagePullPolicy: IfNotPresent
          args: [start]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL_HOST, value: postgres }
            - { name: KC_DB_URL_DATABASE, value: keycloak }
            - { name: KC_DB_USERNAME, value: keycloak_runtime }
            - { name: KC_HEALTH_ENABLED, value: 'true' }
            - { name: KC_HTTP_ENABLED, value: 'true' }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HOSTNAME, value: {{ trimSuffix "/realms/ui4a" .Values.istio.oidcIssuer | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName | quote }}, key: keycloak-database-password }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: ui4a-bootstrap }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName | quote }}, key: keycloak-bootstrap-admin-password }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: 9000 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: keycloak-data, mountPath: /opt/keycloak/data }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: keycloak-data, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: web
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: web, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.web | quote }}
      automountServiceAccountToken: true
      {{- include "ui4a.nodeSelector" . | nindent 6 }}
      {{- include "ui4a.hostAliases" . | nindent 6 }}
      initContainers:
        {{- include "ui4a.trustInit" . | nindent 8 }}
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "migration") | nindent 8 }}
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "realm-bootstrap") | nindent 8 }}
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "temporal-namespace") | nindent 8 }}
        {{- include "ui4a.waitFor" (dict "root" . "dependency" "pki-init") | nindent 8 }}
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.images.web | quote }}
          imagePullPolicy: IfNotPresent
          env:
            {{- include "ui4a.productionEnv" . | nindent 12 }}
            - { name: UI4A_PUBLIC_BASE_URL, value: 'http://web:3100' }
            - name: UI4A_CAPABILITY_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecretName | quote }}, key: capability-callback-token }
          ports:
            - { name: http, containerPort: 3100 }
          livenessProbe:
            httpGet: { path: /live, port: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
          volumeMounts:
            {{- include "ui4a.productionMounts" . | nindent 12 }}
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            {{- include "ui4a.nodeContainerSecurityContext" . | nindent 12 }}
      volumes:
        {{- include "ui4a.productionVolumes" . | nindent 8 }}
        - { name: tmp, emptyDir: {} }
        - { name: next-cache, emptyDir: {} }
---
