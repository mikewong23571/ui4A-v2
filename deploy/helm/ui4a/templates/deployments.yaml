  labels:
    app.kubernetes.io/name: keycloak
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/instance: ui4a }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/instance: ui4a }
    spec:
