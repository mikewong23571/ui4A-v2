apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.istio.gateway | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  selector: { istio: ingressgateway }
  servers:
    - port: { number: 443, name: https, protocol: HTTPS }
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.tlsCredentialName | quote }}
      hosts: [{{ .Values.hosts.web | quote }}, {{ .Values.hosts.keycloak | quote }}]
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ui4a-web
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  hosts: [{{ .Values.hosts.web | quote }}]
  gateways: [{{ .Values.istio.gateway | quote }}]
  http:
    - match:
        - method: { exact: POST }
          uri: { exact: /api/internal/capability-callback }
        - method: { exact: POST }
          uri: { exact: /api/internal/agent-run-callback }
      directResponse: { status: 404 }
    - match:
        - method: { exact: GET }
          uri: { exact: / }
        - method: { exact: GET }
          uri: { exact: /canvas }
        - method: { exact: GET }
          uri: { exact: /chat }
        - method: { exact: GET }
          uri: { exact: /delegations }
        - method: { exact: GET }
          uri: { exact: /entity }
        - method: { exact: GET }
          uri: { exact: /events }
        - method: { exact: GET }
          uri: { exact: /meta }
        - method: { exact: GET }
          uri: { prefix: /meta/ }
        - method: { exact: GET }
          uri: { prefix: /_next/ }
        - method: { exact: GET }
          uri: { exact: /favicon.ico }
        - method: { exact: GET }
          uri: { exact: /file.svg }
        - method: { exact: GET }
          uri: { exact: /globe.svg }
        - method: { exact: GET }
          uri: { exact: /next.svg }
        - method: { exact: GET }
          uri: { exact: /vercel.svg }
        - method: { exact: GET }
          uri: { exact: /window.svg }
        - method: { exact: GET }
          uri: { exact: /live }
        - method: { exact: GET }
          uri: { exact: /version }
        - method: { exact: GET }
          uri: { exact: /api/health }
        - method: { exact: GET }
          uri: { exact: /api/render/catalog }
        - method: { exact: GET }
          uri: { exact: /auth/login }
        - method: { exact: GET }
          uri: { exact: /api/auth/callback }
        - method: { exact: GET }
          uri: { exact: /.well-known/ui4a.json }
        - method: { exact: GET }
          uri: { exact: /_meta/.well-known/ui4a.json }
        - method: { exact: GET }
          uri: { exact: /api/entity }
        - method: { exact: GET }
          uri: { exact: /api/events }
        - method: { exact: GET }
          uri: { exact: /api/delegations }
        - method: { exact: GET }
          uri: { prefix: /api/delegations/ }
        - method: { exact: GET }
          uri: { exact: /_meta/api/entity }
        - method: { exact: GET }
          uri: { exact: /api/presentation/sidecar }
        - method: { exact: POST }
          uri: { exact: /auth/logout }
        - method: { exact: POST }
          uri: { exact: /api/exec }
        - method: { exact: POST }
          uri: { exact: /api/exec-plan }
        - method: { exact: POST }
          uri: { exact: /api/chat }
        - method: { exact: POST }
          uri: { exact: /_meta/api/exec }
        - method: { exact: POST }
          uri: { exact: /api/presentation }
        - method: { exact: POST }
          uri: { exact: /api/presentation/sidecar }
      route:
        - destination: { host: web, port: { number: 3100 } }
    - directResponse: { status: 404 }
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ui4a-keycloak
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  hosts: [{{ .Values.hosts.keycloak | quote }}]
  gateways: [{{ .Values.istio.gateway | quote }}]
  http:
    - match:
        - uri: { prefix: /admin/ }
        - uri: { prefix: /realms/master/ }
        - uri: { exact: /metrics }
        - uri: { prefix: /metrics/ }
        - uri: { exact: /health }
        - uri: { prefix: /health/ }
      directResponse: { status: 404 }
    - match:
        - method: { exact: GET }
          uri: { exact: /realms/ui4a/.well-known/openid-configuration }
        - method: { exact: GET }
          uri: { exact: /realms/ui4a/protocol/openid-connect/auth }
        - method: { exact: GET }
          uri: { exact: /realms/ui4a/protocol/openid-connect/certs }
        - method: { exact: GET }
          uri: { exact: /realms/ui4a/protocol/openid-connect/logout }
        - method: { exact: GET }
          uri: { exact: /realms/ui4a/account }
        - method: { exact: GET }
          uri: { prefix: /realms/ui4a/account/ }
        - method: { exact: GET }
          uri: { prefix: /realms/ui4a/login-actions/ }
        - method: { exact: GET }
          uri: { prefix: /resources/ }
        - method: { exact: POST }
          uri: { exact: /realms/ui4a/protocol/openid-connect/token }
        - method: { exact: POST }
          uri: { exact: /realms/ui4a/protocol/openid-connect/revoke }
        - method: { exact: POST }
          uri: { exact: /realms/ui4a/protocol/openid-connect/logout }
        - method: { exact: POST }
          uri: { exact: /realms/ui4a/account }
        - method: { exact: POST }
          uri: { prefix: /realms/ui4a/account/ }
        - method: { exact: POST }
          uri: { prefix: /realms/ui4a/login-actions/ }
      route:
        - destination: { host: keycloak, port: { number: 8080 } }
    - directResponse: { status: 404 }
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: ui4a-web-jwt
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: web, app.kubernetes.io/instance: ui4a }
  jwtRules:
    - issuer: {{ .Values.istio.oidcIssuer | quote }}
      audiences: [{{ .Values.istio.oidcAudience | quote }}]
      jwksUri: {{ .Values.istio.jwksUri | quote }}
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: ui4a-web
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: web, app.kubernetes.io/instance: ui4a }
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: [GET]
            paths:
              - /
              - /canvas
              - /chat
              - /delegations
              - /entity
              - /events
              - /meta
              - '/meta/*'
              - '/_next/*'
              - /favicon.ico
              - /file.svg
              - /globe.svg
              - /next.svg
              - /vercel.svg
              - /window.svg
              - /live
              - /version
              - /api/health
              - /api/render/catalog
              - /auth/login
              - /api/auth/callback
              - /.well-known/ui4a.json
              - /_meta/.well-known/ui4a.json
              - /api/entity
              - /api/events
              - /api/delegations
              - '/api/delegations/*'
              - /_meta/api/entity
              - /api/presentation/sidecar
    - to:
        - operation:
            methods: [POST]
            paths:
              - /auth/logout
              - /api/exec
              - /api/exec-plan
              - /api/chat
              - /_meta/api/exec
              - /api/presentation
              - /api/presentation/sidecar
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" .Values.namespace.name .Values.serviceAccounts.worker | quote }}
      to:
        - operation:
            methods: [POST]
            paths:
              - /api/internal/capability-callback
              - /api/internal/agent-run-callback
