apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ui4a-runtime-jobs
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "ui4a.labels" . | nindent 4 }}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, create, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ui4a-runtime-jobs
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "ui4a.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.worker | quote }}
    namespace: {{ .Values.namespace.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ui4a-runtime-jobs
