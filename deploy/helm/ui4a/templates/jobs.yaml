apiVersion: batch/v1
kind: Job
metadata:
  name: pki-init
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: pki-init
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: pki-init, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.admin | quote }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pki-init
          image: {{ .Values.images.runner | quote }}
          imagePullPolicy: IfNotPresent
          command: [node, dist/pki-init.js]
          volumeMounts:
            - { name: pki-data, mountPath: /var/lib/ui4a/ca }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: pki-data
          persistentVolumeClaim: { claimName: pki-data }
---
