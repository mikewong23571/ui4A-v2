apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: postgres-bootstrap
    {{- include "ui4a.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-bootstrap, app.kubernetes.io/instance: ui4a }
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.admin | quote }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- include "ui4a.podSecurityContext" . | nindent 8 }}
      containers:
        - name: postgres-bootstrap
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: IfNotPresent
          command: [psql, -v, ON_ERROR_STOP=1, -f, /opt/ui4a/bootstrap-roles.sql]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecretName | quote }} }
          volumeMounts:
            - { name: bootstrap-sql, mountPath: /opt/ui4a, readOnly: true }
          resources:
            {{- include "ui4a.resources" . | nindent 12 }}
          securityContext:
            {{- include "ui4a.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: bootstrap-sql
          configMap: { name: ui4a-postgres-bootstrap }
---
